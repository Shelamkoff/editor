<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Editor history and paste matrix</title>
  <style>
    /* Browser fixtures do not import the package stylesheet. Keep the slash
       menu in the same containing block and reset geometry as production
       before its first render/positioning pass, rather than patching the
       element only after the menu has already opened. */
    .oe-editor { position: relative; }
    .oe-slash-menu {
      position: absolute;
      width: 240px;
      margin: 0;
      padding: 0;
      list-style: none;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "@shelamkoff/event-bus": "../../../event-bus/dist/index.js",
        "@shelamkoff/infinite-scroll": "../../node_modules/@shelamkoff/infinite-scroll/dist/src/index.js",
        "@shelamkoff/masonry": "../../node_modules/@shelamkoff/masonry/dist/src/index.js",
        "@shelamkoff/color-picker": "../../../color-picker/dist/index.js",
        "@shelamkoff/cropper": "../../../cropper/dist/src/index.js",
        "@shelamkoff/carousel": "../../../carousel/dist/src/index.js",
        "@shelamkoff/expose": "../../../expose/dist/src/index.js"
      }
    }
  </script>
</head>
<body data-status="running">
  <div id="sandbox"></div>
  <pre id="result">running</pre>
  <script type="module" src="./history.js"></script>
</body>
</html>
