<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Cropper Test</title>
<style>body{background:#111;color:#fff;font-family:sans-serif;padding:2rem;display:flex;flex-direction:column;gap:1rem}
canvas{border:1px solid #333}
.row{display:flex;gap:2rem;align-items:flex-start}
.avatar{width:160px;height:160px;border-radius:50%;object-fit:cover}
pre{font-size:11px;background:#222;padding:1rem;border-radius:8px;overflow:auto}
</style></head><body>
<h2>Cropper Canvas Test</h2>
<div id="result"></div>
<script type="module">
const img = new Image()
img.crossOrigin = 'anonymous'
img.src = 'https://picsum.photos/400/700'

img.onload = () => {
  const vpSize = 360
  const nW = img.naturalWidth
  const nH = img.naturalHeight
  const fitScale = Math.min(vpSize / nW, vpSize / nH)
  const baseW = nW * fitScale
  const baseH = nH * fitScale

  const scale = 2
  const displayW = baseW * scale
  const displayH = baseH * scale
  const offsetX = (vpSize - displayW) / 2
  const offsetY = (vpSize - displayH) / 2 + 50

  const vx = -offsetX
  const vy = -offsetY
  const ratio = nW / displayW
  const sx = vx * ratio
  const sy = vy * ratio
  const sSize = vpSize * ratio

  const clampedSx = Math.max(0, sx)
  const clampedSy = Math.max(0, sy)
  const clampedSw = Math.min(nW - clampedSx, sSize - (clampedSx - sx))
  const clampedSh = Math.min(nH - clampedSy, sSize - (clampedSy - sy))
  const outSize = Math.min(512, Math.round(sSize))
  const scale2 = outSize / sSize
  const dx = (clampedSx - sx) * scale2
  const dy = (clampedSy - sy) * scale2
  const dw = clampedSw * scale2
  const dh = clampedSh * scale2

  const canvas = document.createElement('canvas')
  canvas.width = outSize
  canvas.height = outSize
  const ctx = canvas.getContext('2d')
  ctx.fillStyle = '#000'
  ctx.fillRect(0, 0, outSize, outSize)
  if (clampedSw > 0 && clampedSh > 0) {
    ctx.drawImage(img, clampedSx, clampedSy, clampedSw, clampedSh, dx, dy, dw, dh)
  }

  const avatarUrl = canvas.toDataURL('image/webp', 0.85)

  const result = document.getElementById('result')
  const origImg = img.cloneNode()
  origImg.style.maxWidth = '200px'

  const avatarImg = document.createElement('img')
  avatarImg.src = avatarUrl
  avatarImg.className = 'avatar'

  const info = { nW, nH, baseW: Math.round(baseW), baseH: Math.round(baseH), scale, displayW: Math.round(displayW), displayH: Math.round(displayH), offsetX: Math.round(offsetX), offsetY: Math.round(offsetY), sx: Math.round(sx), sy: Math.round(sy), sSize: Math.round(sSize), clampedSx: Math.round(clampedSx), clampedSy: Math.round(clampedSy), clampedSw: Math.round(clampedSw), clampedSh: Math.round(clampedSh), dx: Math.round(dx), dy: Math.round(dy), dw: Math.round(dw), dh: Math.round(dh), outSize }

  const pre = document.createElement('pre')
  pre.textContent = JSON.stringify(info, null, 2)

  const h1 = document.createElement('h3')
  h1.textContent = 'Original → Canvas → Avatar'

  const row = document.createElement('div')
  row.className = 'row'
  row.appendChild(origImg)
  row.appendChild(canvas)
  row.appendChild(avatarImg)

  result.appendChild(h1)
  result.appendChild(row)
  result.appendChild(pre)
}
</script></body></html>
