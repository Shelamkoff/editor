name: Apply person realm repair

on:
  push:
    branches:
      - fix/audit-tdd-2026-09-05
    paths:
      - '.github/workflows/apply-person-repair.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Restore and apply verified Person patch
        run: |
          set -euo pipefail
          git checkout 863679db60a90c03a2eead09511d5c303e264380 -- plugins/person/index.js tests/browser/regressions/recheck-87-complex-block-plugin-realm.js
          printf '%s' '' | base64 -d > /tmp/person.patch
          git apply --check /tmp/person.patch
          git apply /tmp/person.patch
          rm .github/workflows/apply-person-repair.yml
          node --check plugins/person/index.js
          node --check tests/browser/regressions/recheck-87-complex-block-plugin-realm.js
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix(person): repair iframe avatar realm patch"
          git push
