name: Verify library

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Check types
        run: npm run typecheck
      - name: Unit tests
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          mkdir -p test-results
          npm test 2>&1 | tee test-results/unit.log
      - name: Archive reproducible test inputs
        if: ${{ !cancelled() }}
        run: |
          mkdir -p test-results
          git archive --format=tar HEAD > test-results/source.tar
          test ! -f package-lock.json || cp package-lock.json test-results/resolved-package-lock.json
          if test -d node_modules; then
            tar -czf test-results/dependencies.tar.gz node_modules
          fi
      - name: Upload verification inputs and results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.sha }}
          path: test-results/
          retention-days: 1
          compression-level: 0

  release:
    name: ${{ matrix.gate }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        gate: [browser, package, docs, budget]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Build package
        run: npm run build
      - name: Run release gate
        env:
          GATE: ${{ matrix.gate }}
        run: |
          set -o pipefail
          mkdir -p test-results
          case "$GATE" in
            browser) npm run test:browser 2>&1 | tee test-results/browser.log ;;
            package) npm run test:package 2>&1 | tee test-results/package.log ;;
            docs) { npm run test:docs && npm run docs:check; } 2>&1 | tee test-results/docs.log ;;
            budget) node benchmarks/bundle-budget.mjs 2>&1 | tee test-results/budget.log ;;
            *) exit 2 ;;
          esac
      - name: Upload release gate results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.gate }}-${{ github.sha }}
          path: test-results/
          retention-days: 3
