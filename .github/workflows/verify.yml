name: Verify library

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['20.19.0', '22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Initialize current-run results
        id: results
        run: node scripts/verification-results.mjs init install typecheck unit
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies
        run: node scripts/verification-results.mjs run install -- npm ci --ignore-scripts
      - name: Check types
        run: node scripts/verification-results.mjs run typecheck --require install -- npm run typecheck
      - name: Unit tests
        if: ${{ !cancelled() }}
        run: node scripts/verification-results.mjs run unit --require install -- npm test
      - name: Archive reproducible test inputs
        if: ${{ !cancelled() }}
        run: |
          test -n "${EDITOR_RESULTS_DIR:?Initialize current-run results first}"
          git archive --format=tar HEAD > "$EDITOR_RESULTS_DIR/source.tar"
          test ! -f package-lock.json || cp package-lock.json "$EDITOR_RESULTS_DIR/resolved-package-lock.json"
          if test -d node_modules; then
            tar -czf "$EDITOR_RESULTS_DIR/dependencies.tar.gz" node_modules
          fi
      - name: Finalize current-run results
        if: ${{ always() }}
        run: node scripts/verification-results.mjs finish
      - name: Upload verification inputs and results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verification-node-${{ matrix.node }}-${{ github.sha }}
          path: ${{ steps.results.outputs.directory }}
          retention-days: 1
          compression-level: 0

  release:
    name: ${{ matrix.gate }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        gate: [browser, package, docs, size-report]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Initialize current-run results
        id: results
        env:
          GATE: ${{ matrix.gate }}
        run: node scripts/verification-results.mjs init install build "$GATE"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Install dependencies
        run: node scripts/verification-results.mjs run install -- npm ci --ignore-scripts
      - name: Build package
        run: node scripts/verification-results.mjs run build --require install -- npm run build
      - name: Run release gate
        env:
          GATE: ${{ matrix.gate }}
        run: |
          case "$GATE" in
            browser|package) node scripts/verification-results.mjs run "$GATE" --require build -- npm run "test:$GATE" ;;
            docs) node scripts/verification-results.mjs run docs --require build -- bash -c 'npm run test:docs && npm run docs:check' ;;
            size-report) node scripts/verification-results.mjs run size-report --require build -- node benchmarks/bundle-budget.mjs --enforce ;;
            *) exit 2 ;;
          esac
      - name: Finalize current-run results
        if: ${{ always() }}
        run: node scripts/verification-results.mjs finish
      - name: Upload release gate results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.gate }}-${{ github.sha }}
          path: ${{ steps.results.outputs.directory }}
          retention-days: 3
