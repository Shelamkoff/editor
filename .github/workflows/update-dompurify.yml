name: Generate DOMPurify dependency update

on:
  push:
    branches:
      - fix/audit-tdd-2026-09-05
    paths:
      - .github/workflows/update-dompurify.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Generate canonical npm metadata
        run: npm install --package-lock-only --ignore-scripts --save-exact dompurify@3.4.15
      - name: Commit generated dependency files
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json
          git diff --cached --check
          git commit -m "build: depend on DOMPurify 3.4.15"
          git push origin HEAD:${GITHUB_REF_NAME}
